# Builds the Windows installer and the macOS disk image, and — for a version
# tag — publishes both on the GitHub Releases page.
#
#   git tag v0.2.0 && git push --tags     # build + publish release v0.2.0
#   gh workflow run build.yml             # build only (files under the run's artifacts)
#   gh run download -n ShareLocal-windows-x64  # fetch a manual build's .exe
#
# The tag sets the version: `v0.2.0` builds ShareLocal 0.2.0, so there is no
# need to edit tauri.conf.json before tagging.

name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    # 64-bit for every current PC; 32-bit for older Windows 10 machines
    # (Windows 11 has no 32-bit edition).
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: i686-pc-windows-msvc
            arch: x86
    name: windows (${{ matrix.arch }})
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Keeps the second and later builds to a few minutes.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Use the tag's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"

      # Tests once, on the 64-bit build; the code is the same for both.
      - name: Front-end tests
        if: matrix.arch == 'x64'
        run: npm test

      - name: Rust unit tests
        if: matrix.arch == 'x64'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # Only the NSIS installer: the other bundle targets in tauri.conf.json
      # belong to macOS and Linux.
      - name: Build installer
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: ShareLocal-windows-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Both architectures, so one .dmg runs on Apple Silicon and Intel Macs.
      # The oldest macOS it accepts is `minimumSystemVersion` in tauri.conf.json.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Use the tag's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Build app
        run: npm run tauri -- build --target universal-apple-darwin --bundles app

      # Signs the whole bundle (ad hoc) and packages it — see make-dmg.sh.
      - name: Build disk image
        run: bash scripts/make-dmg.sh
        env:
          BUNDLE_DIR: src-tauri/target/universal-apple-darwin/release/bundle
          ARCH: universal

      - uses: actions/upload-artifact@v4
        with:
          name: ShareLocal-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    # Only tags publish; a manual run just leaves the files on the run page.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-release/* \
            --title "ShareLocal ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md \
            --generate-notes
